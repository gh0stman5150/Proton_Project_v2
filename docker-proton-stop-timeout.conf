# qBittorrent gets 90 s to stop (stop_grace_period in
# qbittorrent-compose.common.yml) so it can save resume data. Docker stops all
# containers at once, so its own stop must outlast that. With the default 90 s,
# systemd killed dockerd while the slowest clients were still stopping, and
# unless-stopped then left them exited when Docker came back.
[Service]
TimeoutStopSec=180
